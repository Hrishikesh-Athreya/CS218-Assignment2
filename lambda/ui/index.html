<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Directory</title>
  <style>
    :root {
      --ink: #14211f;
      --muted: #64716d;
      --paper: #f3f0e8;
      --card: #fffdf8;
      --line: #d5d0c5;
      --accent: #b94b2f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(rgba(20, 33, 31, .045) 1px, transparent 1px),
        var(--paper);
      background-size: 100% 32px;
      font-family: "Avenir Next", Avenir, sans-serif;
    }

    main {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 72px 0;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--ink);
      padding-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", serif;
      font-size: clamp(2rem, 6vw, 3.75rem);
      font-weight: 500;
      line-height: .95;
    }

    .card {
      border: 1px solid var(--line);
      background: var(--card);
      box-shadow: 8px 8px 0 rgba(20, 33, 31, .09);
      padding: clamp(24px, 5vw, 40px);
    }

    .status {
      margin: 0;
      color: var(--muted);
      font-size: .9rem;
    }

    button, input {
      min-height: 48px;
      border: 1px solid var(--ink);
      border-radius: 0;
      font: inherit;
    }

    button {
      cursor: pointer;
      color: white;
      background: var(--ink);
      padding: 0 22px;
      font-weight: 700;
    }

    button:hover { background: var(--accent); }
    button:disabled { cursor: not-allowed; opacity: .45; }

    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 26px;
    }

    label {
      grid-column: 1 / -1;
      font-weight: 700;
    }

    input {
      width: 100%;
      background: white;
      padding: 0 14px;
    }

    input:focus, button:focus-visible {
      outline: 3px solid rgba(185, 75, 47, .3);
      outline-offset: 2px;
    }

    #message {
      min-height: 24px;
      margin: 20px 0 0;
      color: var(--accent);
      font-weight: 700;
    }

    dl {
      display: grid;
      grid-template-columns: 150px 1fr;
      margin: 18px 0 0;
      border-top: 1px solid var(--line);
    }

    dt, dd {
      margin: 0;
      border-bottom: 1px solid var(--line);
      padding: 13px 0;
    }

    dt { color: var(--muted); }
    dd { overflow-wrap: anywhere; font-weight: 600; }
    [hidden] { display: none !important; }

    @media (max-width: 560px) {
      main { padding: 40px 0; }
      header { align-items: start; flex-direction: column; }
      form { grid-template-columns: 1fr; }
      label { grid-column: auto; }
      dl { grid-template-columns: 1fr; }
      dt { border-bottom: 0; padding-bottom: 2px; }
      dd { padding-top: 2px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Human Resources</p>
        <h1>Employee Directory</h1>
      </div>
      <button id="login" type="button">Sign in</button>
    </header>

    <section class="card">
      <p id="status" class="status">Sign in with Cognito to search employee records.</p>

      <form id="search-form">
        <label for="employee-id">Employee ID</label>
        <input id="employee-id" inputmode="numeric" autocomplete="off" required placeholder="e.g. 1001">
        <button id="search" type="submit" disabled>Search</button>
      </form>

      <p id="message" role="alert"></p>

      <dl id="result" hidden>
        <dt>Employee ID</dt><dd id="result-id"></dd>
        <dt>Name</dt><dd id="result-name"></dd>
        <dt>Salary</dt><dd id="result-salary"></dd>
        <dt>Date of Join</dt><dd id="result-date"></dd>
        <dt>Description</dt><dd id="result-description"></dd>
      </dl>
    </section>
  </main>

  <script>
    const config = __APP_CONFIG__;
    const loginButton = document.querySelector("#login");
    const searchButton = document.querySelector("#search");
    const result = document.querySelector("#result");
    const message = document.querySelector("#message");
    const status = document.querySelector("#status");

    const encode = bytes => btoa(String.fromCharCode(...bytes))
      .replaceAll("+", "-").replaceAll("/", "_").replaceAll("=", "");

    function randomText() {
      return encode(crypto.getRandomValues(new Uint8Array(32)));
    }

    async function signIn() {
      const verifier = randomText();
      const state = randomText();
      const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));

      sessionStorage.setItem("pkce_verifier", verifier);
      sessionStorage.setItem("oauth_state", state);

      const url = new URL(`${config.cognitoDomain}/oauth2/authorize`);
      url.search = new URLSearchParams({
        client_id: config.clientId,
        response_type: "code",
        scope: "openid",
        redirect_uri: config.callbackUrl,
        code_challenge_method: "S256",
        code_challenge: encode(new Uint8Array(digest)),
        state
      });
      location.assign(url);
    }

    async function finishSignIn() {
      const query = new URLSearchParams(location.search);
      if (query.has("error")) throw new Error(query.get("error_description") || "Sign-in failed");
      if (!query.has("code")) return;
      if (query.get("state") !== sessionStorage.getItem("oauth_state")) {
        throw new Error("Invalid sign-in state");
      }

      const tokenResponse = await fetch(`${config.cognitoDomain}/oauth2/token`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          grant_type: "authorization_code",
          client_id: config.clientId,
          code: query.get("code"),
          redirect_uri: config.callbackUrl,
          code_verifier: sessionStorage.getItem("pkce_verifier")
        })
      });

      if (!tokenResponse.ok) throw new Error("Token exchange failed");
      const tokens = await tokenResponse.json();
      sessionStorage.setItem("id_token", tokens.id_token);
      sessionStorage.removeItem("pkce_verifier");
      sessionStorage.removeItem("oauth_state");
      history.replaceState({}, "", location.pathname);
    }

    function updateAuthState() {
      const signedIn = Boolean(sessionStorage.getItem("id_token"));
      loginButton.hidden = signedIn;
      searchButton.disabled = !signedIn;
      status.textContent = signedIn
        ? "Authenticated. Enter an employee ID."
        : "Sign in with Cognito to search employee records.";
    }

    loginButton.addEventListener("click", signIn);

    document.querySelector("#search-form").addEventListener("submit", async event => {
      event.preventDefault();
      message.textContent = "Searching…";
      result.hidden = true;

      try {
        const id = document.querySelector("#employee-id").value.trim();
        const response = await fetch(`${config.apiBaseUrl}/employee/${encodeURIComponent(id)}`, {
          headers: { Authorization: `Bearer ${sessionStorage.getItem("id_token")}` }
        });
        const body = await response.json();

        if (!response.ok) {
          if (response.status === 401) {
            sessionStorage.removeItem("id_token");
            updateAuthState();
          }
          throw new Error(body.message || "Employee lookup failed");
        }

        document.querySelector("#result-id").textContent = body.employeeId;
        document.querySelector("#result-name").textContent = body.name;
        document.querySelector("#result-salary").textContent =
          Number(body.salary).toLocaleString("en-US", { style: "currency", currency: "USD" });
        document.querySelector("#result-date").textContent = body.dateOfJoin;
        document.querySelector("#result-description").textContent = body.description;
        message.textContent = "";
        result.hidden = false;
      } catch (error) {
        message.textContent = error.message;
      }
    });

    finishSignIn()
      .catch(error => { message.textContent = error.message; })
      .finally(updateAuthState);
  </script>
</body>
</html>
